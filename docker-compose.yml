services:
  neo4j:
    image: neo4j:5.26-community
    container_name: knowledge-graph-neo4j

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'

    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/plugins:/plugins
      - ./data/neo4j/import:/import

    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: knowledge-graph-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      - neo4j

    restart: unless-stopped